ServerName momaken.net

# إخفاء تفاصيل السيرفر عن المخترقين
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName momaken.net
    # إعادة توجيه دائمة ومحسنة
    Redirect permanent / https://momaken.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName momaken.net
    ServerAdmin admin@momaken.net

    # إعدادات SSL
    SSLEngine on
    SSLCertificateFile /home/momaken/momaken/momaken.net.crt
    SSLCertificateKeyFile /home/momaken/momaken/momaken.net.key
    SSLCertificateChainFile /home/momaken/momaken/momaken_net2.ca-bundle
    
    # تحسين أمان SSL (منع البروتوكولات القديمة)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    # ----------------
    # Security Headers (إضافات أمنية هامة)
    # ----------------
    # منع تشغيل موقعك داخل Iframe (حماية من Clickjacking)
    Header always set X-Frame-Options "SAMEORIGIN"
    # منع المتصفح من تخمين نوع الملفات (حماية من رفع ملفات خبيثة)
    Header always set X-Content-Type-Options "nosniff"
    # تفعيل الحماية من XSS
    Header always set X-XSS-Protection "1; mode=block"
    # إجبار المتصفح على تذكر أن الموقع آمن (HSTS)
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    # ----------------
    # ضغط الملفات (كما هو)
    # ----------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json application/javascript application/x-javascript text/css text/html text/plain text/xml
    </IfModule>

    # ----------------
    # إعدادات البروكسي والملفات
    # ----------------
    
    # WebSocket
    ProxyPass "/ws/" "ws://127.0.0.1:8001/ws/"
    ProxyPassReverse "/ws/" "ws://127.0.0.1:8001/ws/"

    # API Backend
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    # Static Files
    Alias /static /home/momaken/momaken/staticfiles/
    <Directory /home/momaken/momaken/staticfiles>
        Require all granted
        # منع استعراض الملفات (Directory Listing)
        Options -Indexes
    </Directory>

    # Media Files (الأهم أمنياً)
    Alias /media/ /home/momaken/momaken/media/
    <Directory /home/momaken/momaken/media/>
        Require all granted
        # منع استعراض الملفات
        Options -Indexes
        # منع تشغيل أي سكربتات داخل مجلد الميديا
        Options -ExecCGI
        SetHandler None
        SetHandler default-handler
    </Directory>

    # Frontend (Next.js)
    ProxyPassMatch ^/(?!media/|static/|api/|ws/)(.*)$ http://127.0.0.1:3000/$1
    ProxyPassReverse / http://127.0.0.1:3000/
    
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/momaken-error.log
    CustomLog ${APACHE_LOG_DIR}/momaken-access.log combined
</VirtualHost>